<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Wave Ring / Visual Sound Accents -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="256" cy="230" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>

  <!-- Microphone Icon -->
  <g filter="url(#glow)">
    <!-- Mic Body -->
    <rect x="216" y="140" width="80" height="150" rx="40" fill="url(#micGrad)"/>
    
    <!-- Sound Waves / Arc around mic -->
    <path d="M 170 230 C 170 280, 342 280, 342 230" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Mic Stem & Base -->
    <path d="M 256 290 L 256 345" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <path d="M 206 350 L 306 350" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- Sound Equalizer Bars at bottom -->
  <g fill="#ffffff" fill-opacity="0.9">
    <rect x="180" y="385" width="12" height="30" rx="6"/>
    <rect x="205" y="375" width="12" height="50" rx="6"/>
    <rect x="230" y="365" width="12" height="70" rx="6"/>
    <rect x="255" y="370" width="12" height="60" rx="6"/>
    <rect x="280" y="380" width="12" height="40" rx="6"/>
    <rect x="305" y="390" width="12" height="20" rx="6"/>
  </g>
</svg>
