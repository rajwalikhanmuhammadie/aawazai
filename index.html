    <!-- Intercept and silence Vite HMR WebSocket in AI Studio iframe environment where HMR is disabled -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite') || url.includes('token=')))) {
              var listeners = {};
              var mockWs = {
                readyState: 1, // WebSocket.OPEN
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() { try { fn({ type: 'open' }); } catch(e){} }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                  }
                },
                dispatchEvent: function() { return false; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              setTimeout(function() {
                if (typeof mockWs.onopen === 'function') {
                  try { mockWs.onopen({ type: 'open' }); } catch(e){}
                }
              }, 0);
              return mockWs;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var msg = event?.reason?.message || String(event?.reason || '');
          if (msg.includes('WebSocket') || msg.includes('closed without opened')) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = event?.message || '';
          if (msg.includes('WebSocket') || msg.includes('closed without opened')) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
      })();
    </script>
